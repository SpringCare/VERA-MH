name: Docker

# Split out of ci.yml so it only runs when something that can break the image
# changes. Application code can't: the smoke test only checks the interpreter.
# The weekly run catches drift in the unpinned python:3.14-slim base image.
on:
  push:
    branches: [ main ]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker.yml
  pull_request:
    branches: [ main ]
    paths:
      - Dockerfile
      - .dockerignore
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        load: true
        tags: vera-mh:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke-test Docker image
      run: docker run --rm vera-mh:test python3 --version

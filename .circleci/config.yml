version: 2.1

executors:
  python:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/vera-mh

commands:
  setup-uv:
    description: Install uv, restore its cache, and sync all extras.
    steps:
      - checkout

      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}
            - uv-v1-

      - run:
          name: Install dependencies
          command: uv sync --all-extras

      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv

jobs:
  code-quality:
    executor: python
    steps:
      - setup-uv

      - run:
          name: Check code formatting with Ruff
          command: uv run ruff format --check .

      - run:
          name: Lint with Ruff
          command: uv run ruff check .

      # Not gating the build on type errors while the project is a prototype,
      # matching the `continue-on-error: true` this replaces.
      - run:
          name: Type check with Pyright (non-blocking)
          command: uv run pyright || true

  test:
    executor: python
    steps:
      - setup-uv

      - run:
          name: Run tests (excluding live tests; no API keys required)
          command: |
            uv run pytest -m "not live" \
              --junitxml=test-results/pytest/results.xml

      - store_test_results:
          path: test-results

      # Coverage HTML comes from --cov-report=html in pyproject.toml addopts.
      - store_artifacts:
          path: htmlcov
          destination: coverage

  docker-build:
    executor: python
    steps:
      - checkout

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: docker build -t vera-mh:test .

      - run:
          name: Smoke-test Docker image
          command: docker run --rm vera-mh:test python3 --version

workflows:
  ci:
    jobs:
      - code-quality
      - test
      - docker-build
